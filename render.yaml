# Render blueprint: FastAPI backend + managed PostgreSQL 15.
# Create the services from this file in the Render dashboard, then set the
# secret environment variables there (never commit them).
# The frontend is deployed separately (see frontend/vercel.json).

services:
  - type: web
    name: retail-scheduler-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: retail-scheduling-db
          property: connectionString
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USERNAME
        sync: false
      - key: EMAIL_PASSWORD
        sync: false

databases:
  - name: retail-scheduling-db
    plan: free
    postgresMajorVersion: 15
