[project]
# Runtime dependencies for the deployed API. Vercel's Python runtime builds
# with `uv lock`, which requires this table — keep it in sync with
# requirements.txt (the local-dev / CI install source).
name = "retail-shift-scheduling-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "python-multipart==0.0.20",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "email-validator==2.2.0",
    "SQLAlchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.3.6",
    "PyJWT==2.14.0",
    "bcrypt==5.0.0",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# E4/E7/E9/F: errors + pyflakes. B: bugbear. UP: pyupgrade for 3.11 syntax.
# I: import sorting.
select = ["E4", "E7", "E9", "F", "B", "UP", "I"]
ignore = [
    # FastAPI's Depends()/Query() defaults are the framework's documented idiom.
    "B008",
    # Deliberate `str, enum.Enum` mixins (not StrEnum): the codebase compares
    # enum members against plain strings in queries and stores raw values.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.vercel]
# Explicit entrypoint for Vercel's Python runtime: load `app` from
# `app/main.py` relative to the backend/ project root.
entrypoint = "app.main:app"
